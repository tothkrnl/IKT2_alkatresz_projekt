<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2T olaj keverési arány</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <main class="container">
        <h1>2T olaj keverési arány</h1>
        <p class="subtitle">Somogyi Zoltán kérésére</p>

        <div class="card">
            <label for="gasolineLiters">Mennyi benzin van?</label>
            <input type="number" id="gasolineLiters" min="0" step="0.1" placeholder="pl. 10">

            <label for="ratioSelect">Keverési arány</label>
            <select id="ratioSelect">
                <option value="25">1 : 25</option>
                <option value="32">1 : 32</option>
                <option value="40" selected>1 : 40</option>
                <option value="50">1 : 50</option>
            </select>

            <button type="button" onclick="calculateRatio()">Számolás</button>
            <p id="result" class="result">Az eredmény itt jelenik meg.</p>
        </div>
    </main>

    <script>
        function calculateRatio() {
            const gasolineLiters = parseFloat(document.getElementById("gasolineLiters").value);
            const ratio = parseFloat(document.getElementById("ratioSelect").value);
            const resultElement = document.getElementById("result");

            if (!gasolineLiters || gasolineLiters <= 0 || !ratio || ratio <= 0) {
                resultElement.textContent = "Kérlek adj meg érvényes adatokat!";
                return;
            }

            const oilAmount = gasolineLiters / ratio;
            resultElement.textContent = `A keveréshez ${oilAmount.toFixed(2)} liter 2T olaj kell ${gasolineLiters.toFixed(2)} liter benzinhez.`;
        }
    </script>
</body>
</html>
